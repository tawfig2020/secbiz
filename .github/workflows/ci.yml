name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, dev extras)
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Validation suite
        run: python validate.py
      - name: Fuzz smoke
        run: python fuzz_gateway.py --iterations 1000

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Install from wheel (fresh venv)
        run: |
          python -m venv /tmp/aegis-venv
          /tmp/aegis-venv/bin/pip install dist/aegis-*.whl
          /tmp/aegis-venv/bin/python -c "import aegis; print(aegis.__file__)"
      - name: Run tests against installed wheel
        run: |
          /tmp/aegis-venv/bin/pip install hypothesis
          /tmp/aegis-venv/bin/python -m unittest discover -s tests -t .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[lint]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src/aegis

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit cyclonedx-py
      - name: Dependency vulnerability scan (strict)
        run: pip-audit --strict -r requirements.lock
      - name: Generate SBOM
        run: python sbom.py --out sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
